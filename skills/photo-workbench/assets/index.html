<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影库 · 摄影工作台</title><link rel="icon" href="assets/photo-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/photo-app.css"></head><body>
<aside><a class="brand" href="#home"><img src="assets/photo-icon.svg" alt=""><span>影库<small>PHOTOGRAPHY</small></span></a><nav aria-label="主要功能"><a href="#home" data-page="home"><span>◫</span>摄影概况</a><a href="#library" data-page="library"><span>▦</span>照片库</a><a href="#review" data-page="review"><span>✓</span>待你确认 <b id="review-count"></b></a></nav><div class="aside-bottom"><button id="feedback-open">＋ 提意见</button><a href="#learning" data-page="learning">经验与改进</a><a href="#maintenance" data-page="maintenance">资料与维护</a><p>按你通知的批次整理<br>保留时光，让主题生长</p></div></aside>

<dialog id="photo-dialog"><button id="photo-close" class="close">关闭大图</button><img id="large-photo" alt="照片大图"><p id="large-caption"></p></dialog><div id="toast" role="status"></div><script src="assets/photo-app.js"></script></body></html>
